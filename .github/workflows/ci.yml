on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'assembleDebug'
        type: choice
        options:
          - assembleDebug
          - assembleRelease
      target_sdk:
        description: 'Android SDK Platform Version'
        required: true
        default: '34'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install platform, build-tools and NDK
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platforms;android-${{ inputs.target_sdk || '34' }}" \
            "build-tools;34.0.0" \
            "ndk;27.2.12479018" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK (payload + app)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          # Use the input build type if manually triggered, otherwise default to assembleDebug
          BUILD_COMMAND="${{ github.event.inputs.build_type || 'assembleDebug' }}"
          ./gradlew "$BUILD_COMMAND"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SamTimer-apk
          path: app/build/outputs/apk/**/*.apk
